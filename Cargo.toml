[package]
name = "bajan"
version = "0.1.0"
edition = "2024"
description = "Spec-driven knowledge-graph pipeline CLI"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/bajan"

[dependencies]
# Suite envelope output — genesis is the shared charly-vibes infrastructure crate.
genesis = { package = "genesis-vibes", git = "https://github.com/charly-vibes/genesis" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = true