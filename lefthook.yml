# Hard-blocker gates for bajan.
# Wired via core.hooksPath -> .beads/hooks/{pre-commit,pre-push} lefthook shims.
# Bypass (use sparingly, never on spec-affecting changes): LEFTHOOK=0 git commit

pre-commit:
  commands:
    dont-gate:
      run: dont prime --json > /dev/null
    espectacular:
      run: ah check
    spec-drift-gate:
      # Regenerate the deployed openspec/ mirror from the corpus and fail
      # unless a fresh redeploy is staged into this commit. The failure
      # output names the remedy — "current but unstaged" (fresh worktree,
      # untouched index) vs "staged mirror is stale" — instead of a
      # misleading "stale" for both (beads bajan-16o; logic in
      # tools/spec_drift_gate.sh, gently precedent).
      run: bash tools/spec_drift_gate.sh
    specodelic:
      run: spk lint specs
    pretender:
      run: pretender check

pre-push:
  commands:
    dont-gate:
      run: dont prime --json > /dev/null
    espectacular:
      run: ah check --run-tests
    specodelic:
      run: spk lint specs
    testaruda-doctor:
      run: testaruda doctor
    pretender:
      run: pretender check
