# Pinned ecosystem tool versions for this repo's CI and dev setup.
# Standardization §4: installs are pinned, never `latest` — a broken release
# of any tool must not break CI of the whole fleet.
# Update deliberately; versions here mirror .github/workflows/ci.yml.
#
# §4 matrix row (bajan): just ✅ · wai ✅ · bd ✅ · openspec ✅ ·
# ddl ✅ (§4 record convention: this file + the kaya record workflow) ·
# pretender ✅ · ah (espectacular) ✅ · dont ✅ · testaruda ✅ ·
# specodelic ✅ · kaya ✅

[tools]
kaya = "0.4.1"             # crates.io — record ledger (just record-capture / record-verify)
wai = "2026.11.11"         # crates.io: wai-cli — research artifacts; record-capture imports them
pretender = "0.6.0"        # crates.io — lefthook pretender check
testaruda = "0.5.9"        # crates.io — test selection gate (just test, pre-push doctor)
dont = "0.2.2"             # crates.io: dont-cli — lefthook dont-gate
specodelic = "0.2.0"       # crates.io (bin: spk) — spec corpus lint
espectacular = "0.8.0"     # crates.io (bin: ah) — spec ↔ test correspondence gate
openspec = "1.15.0"        # npm: @fission-ai/openspec — change proposals, CI strict validation
bd = "1.3.0"               # beads — pinned GitHub release download (no versioned homebrew-core formula)
