source = "ingestion.contract"

[[constraints]]
id = "ic_verbatim"
kind = "invariant"
expr = "an episode persists its verbatim text plus a locator (heading anchor, text fragment, or page/slide) and immutable source metadata: stable id, source type, data cutoff, authority tier"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_idempotent"
kind = "invariant"
expr = "re-ingesting an already-ingested episode stream yields a graph identical to the one it produced before — no duplicate episodes, no mutated provenance"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_no-format-parsing"
kind = "invariant"
expr = "the ingest pipeline consumes only the normalized episode stream; it performs no format-specific parsing and derives no structure from file syntax"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_date-fidelity"
kind = "advisory"
expr = "a persisted episode's data cutoff is the source's cutoff when discoverable, `unknown` otherwise — never the ingest timestamp"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_stream-schema"
kind = "extension_point"
expr = "the episode-stream record schema (field names, types, requiredness) is published for converters to conform to"
traces_to = "[[ingestion.contract]]"
