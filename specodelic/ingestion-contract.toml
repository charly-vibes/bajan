source = "ingestion.contract"

[[constraints]]
id = "ic_verbatim"
kind = "invariant"
expr = "an episode persists its verbatim text plus a locator (heading anchor, text fragment, page/slide) or an explicit absent marker when none is derivable — absent is represented so it can never collide with a real locator value — plus immutable source metadata (stable id, source type, data cutoff, authority tier, optional workspace tags), and any converter-supplied structure markers (section boundaries, links)"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_malformed"
kind = "invariant"
expr = "an episode whose verbatim text is absent, empty, or whitespace-only, or that lacks a stable id or required source metadata, is rejected and never persisted"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_id_canon"
kind = "invariant"
expr = "a stable id is a nonempty, non-whitespace-only string in NFC normalization; id equality is decided on the normalized form — two records whose ids differ only by Unicode normalization form denote the same episode"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_unique_id"
kind = "invariant"
expr = "the store holds at most one persisted episode per stable id, independent of submission order, interleaving, or concurrency; a submission matching an already-persisted id never creates a second episode"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_batch_resume"
kind = "invariant"
expr = "episode persistence is transactional per episode (each episode all-or-nothing) and batch atomicity is not guaranteed; re-submitting a stream after a partial persistence converges to the graph a single uninterrupted submission would have produced"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_idempotent"
kind = "invariant"
expr = "re-ingesting an already-ingested episode stream yields a graph identical to the one it produced before — no duplicate episodes, no mutated provenance"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_no_format_parsing"
kind = "invariant"
expr = "the ingest pipeline consumes only the normalized episode stream; it performs no format-specific parsing and derives no structure from file syntax"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_mutated_resubmit"
kind = "invariant"
expr = "a re-submission of a stable id already persisted in the store whose verbatim text, locator, or source metadata differs from the persisted episode is rejected with a machine-readable conflict reason; the persisted episode is never updated in place and never duplicated — updating would orphan claims whose lineage text no longer matches, violating the hedge-anchor discipline"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_corrected_resubmit"
kind = "invariant"
expr = "a stable id in state rejected may be re-submitted with a corrected record; the corrected record passes through the same acceptance path as a fresh episode and persists exactly once"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_state_orthogonal"
kind = "invariant"
expr = "an ingest outcome record reflects only ingestion outcomes with their own machine-readable reasons (`malformed`, `conflict`, `duplicate`); extraction state never appears on it — an episode parked in extraction's `rejected` after repeated call failure is persisted, so its unchanged re-submission is `already_persisted`, and the parked episode's retry accounting lives exclusively in extraction run records"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_deleted_tombstone"
kind = "invariant"
expr = "deleting a persisted episode — permitted only when no claim supports it, per `gm_lineage_survives` in graph.model — removes the episode and records a deletion tombstone for its stable id; any later submission of a tombstoned id, unchanged or mutated, is rejected with a machine-readable deleted-id reason; the tombstone survives every re-submission, so the graph after ingest → delete → re-ingest equals the plain-ingest graph exactly minus the deleted episode — re-ingest never resurrects a deleted episode"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_deleted_recreate"
kind = "invariant"
expr = "a tombstoned stable id becomes re-ingestable only through an explicit operator revive action that clears the tombstone; revive alone changes nothing until a new submission, which then persists through the normal acceptance path exactly once — no automated path (re-ingest, batch replay, dump-recreate rebuild) clears a tombstone"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_batch_duplicate"
kind = "invariant"
expr = "within one submitted stream, the first occurrence of a stable id persists and every later occurrence of that id in the same stream is rejected with a machine-readable duplicate reason; rejection is per record and never extends to other episodes in the batch"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_empty_stream"
kind = "invariant"
expr = "a stream with zero episodes is a valid no-op: ingest succeeds, emits zero outcome records, and leaves the graph unchanged — it is never an error"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_order_insensitive"
kind = "invariant"
expr = "ingesting the same episode stream in any episode order yields an identical graph, both on first ingest and when re-ingesting an already-ingested stream"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_date_fidelity"
kind = "advisory"
expr = "a persisted episode's data cutoff is the source's cutoff when discoverable, an explicit absent marker otherwise — never the ingest timestamp"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_stream-schema"
kind = "extension_point"
expr = "the episode-stream record schema (field names, types, requiredness, including the absent-marker representation for locator and cutoff fields) is published for converters to conform to"
traces_to = "[[ingestion.contract]]"

[[constraints]]
id = "ic_outcome-schema"
kind = "extension_point"
expr = "the per-episode ingest outcome record schema (`persisted`, `already_persisted`, `rejected` with machine-readable reason) is published for converter specs to conform to"
traces_to = "[[ingestion.contract]]"
