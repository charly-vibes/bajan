source = "graph.model"

[[constraints]]
id = "gm_reified"
kind = "invariant"
expr = "every claim is a node with at least one `derived_from` edge to an episode node; a claim synthesized from N sources carries N lineage edges, one per episode"
traces_to = "[[graph.model]]"

[[constraints]]
id = "gm_human_adopt"
kind = "invariant"
expr = "a claim moves from `proposed` to `active` only through an explicit human accept action (CLI `bajan adopt`; batch accepts of multiple claims in one session are permitted) — no automated stage, re-ingest, or merge may set `active` — and every accepted claim's transition is individually recorded with actor and timestamp, one audit record per claim"
traces_to = "[[graph.model]]"

[[constraints]]
id = "gm_lineage_survives"
kind = "invariant"
expr = "invalidation sets `invalid_at` and never destroys lineage; a claim is deleted only when no episode supports it any longer"
traces_to = "[[graph.model]]"

[[constraints]]
id = "gm_deterministic_er"
kind = "invariant"
expr = "entity resolution is deterministic (normalization plus curated alias lists); unmatched mentions create new entity nodes; merge candidates are proposed as `possible_duplicate_of` edges into a review queue; no silent or automatic merge"
traces_to = "[[graph.model]]"

[[constraints]]
id = "gm_merge_keeps"
kind = "invariant"
expr = "a merge is performed only after explicit human resolution of a review candidate, and it preserves every lineage edge from both sides; rejecting a candidate removes only its `possible_duplicate_of` edge"
traces_to = "[[graph.model]]"

[[constraints]]
id = "gm_schema_v2"
kind = "invariant"
expr = "claim nodes carry exactly: text, valid_at, invalid_at, data_cutoff, status, scope, source_type, evidence — evidence is a verbatim span of the supporting episode text plus its episode locator, or the typed absent marker (never a value that can collide with a real span) when sentence alignment failed — source_type inherited from the episode; no confidence field and no vector blob on any node"
traces_to = "[[graph.model]]"

[[constraints]]
id = "gm_embedded_store"
kind = "invariant"
expr = "the graph persists as plain rows in a single embedded SQLite database and is fully rebuildable from the episode stream plus extraction output"
traces_to = "[[graph.model]]"

[[constraints]]
id = "gm_hedge_anchor"
kind = "invariant"
expr = "epistemic strength lives only in verbatim episode text; derived artifacts must not upgrade a hedged source statement to an unhedged claim; an evidence span must not drop a hedge marker present in the supporting episode text within the span's coverage"
traces_to = "[[graph.model]]"

[[constraints]]
id = "gm_relation_typing"
kind = "extension_point"
expr = "the claim relation vocabulary (`mentions`, `contradicts`, `supports`, `derived_from`, `possible_duplicate_of`) is published for query-tool specs to conform to"
traces_to = "[[graph.model]]"
