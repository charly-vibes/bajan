source = "eval.claims"

[[constraints]]
id = "ev_golden_corpus"
kind = "invariant"
expr = "a golden corpus is a versioned fixture of episodes where every episode carries a known claim set — each golden claim listing its source count N (the `p_reified` contract), its evidence span within the episode text, and its hedge markers; the corpus version is stamped on every eval run record"
traces_to = "[[eval.claims]]"

[[constraints]]
id = "ev_deterministic_scoring"
kind = "invariant"
expr = "scoring maps a candidate claim to a golden claim only when normalized text content matches and the candidate's evidence span passes the same whitespace-collapsed containment check as `ex_evidence_containment`; identical inputs (corpus version, extractor version, seed) produce byte-identical scores — no embedding similarity and no LLM judgment anywhere in scoring"
traces_to = "[[eval.claims]]"

[[constraints]]
id = "ev_precision_recall"
kind = "invariant"
expr = "every eval run publishes precision (matched candidates / emitted candidates), recall (matched golden claims / total golden claims), and the hedge-preservation rate, computed per corpus and per extractor version, plus raw match counts so the ratios are recomputable; an eval run emits exactly one results record per (corpus version, extractor version) pair"
traces_to = "[[eval.claims]]"

[[constraints]]
id = "ev_hedge_scoring"
kind = "invariant"
expr = "a candidate whose evidence span or text drops a hedge marker present in the supporting golden episode within the span's coverage scores as a precision failure with reason `hedge-dropped`, distinct from a content miss, so hedge fidelity is a first-class reported number per `gm_hedge_anchor`"
traces_to = "[[eval.claims]]"

[[constraints]]
id = "ev_readonly"
kind = "invariant"
expr = "an eval run writes only to its own scratch store and results record — it never mutates episodes, claims, or audit records of a real store, and it never moves any claim toward `active`; the only automated state the harness can produce is the pipeline's own `staged`/`rejected` outcomes inside the scratch store, adoption remains human-only per `gm_human_adopt`"
traces_to = "[[eval.claims]]"

[[constraints]]
id = "ev_results_checked_in"
kind = "invariant"
expr = "eval results persist as a checked-in `evals/results.md` table — corpus version, extractor version, date, precision, recall, hedge-preservation rate, raw counts — and regenerating from the same inputs reproduces the same row values, making the storage-stack decision (keep SQLite vs earn a graph DB) auditable to its numbers"
traces_to = "[[eval.claims]]"

[[constraints]]
id = "ev_results-schema"
kind = "extension_point"
expr = "the eval results record schema (fields, types, requiredness, including the match-record and reason vocabulary `matched`, `content-miss`, `spurious`, `hedge-dropped`) is published for reporting specs to conform to"
traces_to = "[[eval.claims]]"
