source = "extraction.claims"

[[constraints]]
id = "ex_single_call"
kind = "invariant"
expr = "each persisted episode id receives exactly one successful LLM extraction call producing candidate claims and entities; failed calls retry with backoff and park the episode in `rejected` after repeated failure; re-ingest of a successfully extracted episode reuses the (episode id, extractor version)-keyed cached output and starts no new call"
traces_to = "[[extraction.claims]]"

[[constraints]]
id = "ex_park_requeue"
kind = "invariant"
expr = "an episode parked in `rejected` after repeated call failure holds no extraction-cache entry at the failed extractor version, so a later extraction pass re-attempts it with a fresh retry budget — the park is one run's honest stopping, never a permanent state; every re-attempt writes its own run rows and prior parked run rows persist with their reasons; re-ingest is orthogonal — an unchanged re-submission of a parked episode is an ingest-side no-op (`already_persisted`) that neither grants nor blocks the fresh budget, because eligibility follows cache absence, never re-ingest"
traces_to = "[[extraction.claims]]"

[[constraints]]
id = "ex_typed_gate"
kind = "invariant"
expr = "a candidate claim persists only if it validates against the published claim schema, carries at least one episode lineage edge, and carries an evidence span that passes `ex_evidence_containment`; invalid candidates are rejected, never repaired; an episode with zero valid candidates is legitimately extracted and cached as empty"
traces_to = "[[extraction.claims]]"

[[constraints]]
id = "ex_supersession"
kind = "invariant"
expr = "re-extracting an episode at a new extractor version supersedes only that episode's `staged` claims derived from prior extractor versions — they become `rejected` with reason `superseded-by-reextraction`, lineage and evidence intact (a tombstone, not a delete) — while `active` and `rejected` claims from any version are never mutated; new output that conflicts with an `active` claim stages an invalidation proposal per `ex_mutation_proposal`; a superseded claim re-enters `staged` only through an explicit re-stage action, never an automated path"
traces_to = "[[extraction.claims]]"

[[constraints]]
id = "ex_run_record"
kind = "invariant"
expr = "every extraction call writes one run row — episode id, extractor version, model id when the extractor uses an LLM, started and finished timestamps, finish status — parallel to, and without changing, the `(episode id, extractor version)` cache economics; every failure outcome (an episode parked in `rejected` after repeated call failure, every candidate rejection at the validation gate) carries a machine-readable reason stored on the run or rejection record, never on a claim node"
traces_to = "[[extraction.claims]]"

[[constraints]]
id = "ex_evidence_containment"
kind = "invariant"
expr = "every candidate claim carries an evidence span — a verbatim span of the supporting episode text plus its episode locator, or the typed absent marker when sentence alignment failed — validated by containment after whitespace collapse (all whitespace runs become a single space) of both span and episode text; a span failing containment is rejected with reason `evidence-not-contained`, never repaired; a typed-absent span persists but is flagged by the deterministic pass (`ex_reflection` extended), not treated as a violation"
traces_to = "[[extraction.claims]]"

[[constraints]]
id = "ex_no_llm_post"
kind = "invariant"
expr = "normalization, dedup, entity matching, and conflict detection after the extraction call are deterministic; normalization rules appear both as prompt instructions and in a deterministic post-pass, because prompts are not bulletproof"
traces_to = "[[extraction.claims]]"

[[constraints]]
id = "ex_mutation_proposal"
kind = "invariant"
expr = "a candidate claim that conflicts with an existing active claim stages an invalidation proposal carrying its causing-episode lineage; the existing claim is not mutated by the extractor"
traces_to = "[[extraction.claims]]"

[[constraints]]
id = "ex_reflection"
kind = "advisory"
expr = "the single extraction call includes a self-check that verifies candidate claims against the episode text and enriches change lineage, rendered as flags by a deterministic pass; it flags unsupported candidates and never introduces new ones, and it is not a second LLM call"
traces_to = "[[extraction.claims]]"

[[constraints]]
id = "ex_tag_inheritance"
kind = "invariant"
expr = "workspace tags and source metadata on an episode are inherited by every claim derived from it as a projection — the union over its lineage edges, resolved by walking `derived_from` at query time — and are never stored on the claim node"
traces_to = "[[extraction.claims]]"

[[constraints]]
id = "ex_deterministic_structure"
kind = "invariant"
expr = "structure the converter already supplied (heading anchors, section boundaries, links) is consumed deterministically and never re-extracted by the LLM"
traces_to = "[[extraction.claims]]"

[[constraints]]
id = "ex_output_schema"
kind = "extension_point"
expr = "the candidate-claim record schema (field names, types, requiredness) is published for eval-harness specs to conform to"
traces_to = "[[extraction.claims]]"
