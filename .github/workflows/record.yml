# Record workflow — capture a scheduled snapshot on main
#
# Runs nightly (and on demand) on main only: capture wai artifacts and recent
# commits into the kaya record, rebuild projections, and commit the snapshot
# deliberately. Capture never runs in a hook or on a pull request; it needs a
# clean tree (`just record-capture` skips on a dirty one).
#
# Deliberately NOT triggered on push: a capture derived from push N collides
# with local commits landing while the run executes (the kaya repo's v0.3.0
# lesson). The push retry loop below is a bare `git push` replaced by
# `git pull --rebase` + push, with conflict abandonment.

name: Record

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    name: Capture record snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install kaya and wai-cli (pinned to released tags)
        run: |
          cargo install --locked kaya@0.4.1
          cargo install --locked --git https://github.com/charly-vibes/wai --tag v2026.11.11 wai-cli

      - name: Configure git
        run: |
          git config user.name "bajan record"
          git config user.email "record@bajan.invalid"

      - name: Capture the snapshot
        run: just record-capture

      - name: Commit and push the snapshot (rebase retry)
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "record is current; nothing to commit"
            exit 0
          fi
          git commit -m "chore(record): capture scheduled snapshot"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            if [ -d .git/rebase-merge ]; then
              echo "snapshot push abandoned: rebase conflict" >&2
              exit 1
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "snapshot push failed after 5 attempts" >&2
          exit 1
